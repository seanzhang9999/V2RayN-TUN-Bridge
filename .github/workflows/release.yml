name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore and verify the tested runtime from the immutable prior asset
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP prior-release.zip
          Invoke-WebRequest -Uri 'https://github.com/seanzhang9999/V2RayN-TUN-Bridge/releases/download/v0.2.4/V2RayN-TUN-Bridge-v0.2.4-windows-x64.zip' -OutFile $archive
          python packaging/guard_release.py $archive
      - name: Test
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD src
          python -m unittest discover -s tests -v
      - name: Package and verify the guard console
        run: python packaging/guard_release.py
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/tags/v0.3.4-rc.1'
        with:
          prerelease: true
          body_path: docs/release-v0.3.4-rc.1.md
          fail_on_unmatched_files: true
          files: |
            dist/V2RayN-TUN-Bridge-*-windows-x64.zip
            dist/SHA256SUMS.txt
