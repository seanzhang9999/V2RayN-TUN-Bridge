name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD 'src'
          python -m unittest discover -s tests -v
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errorsFound = @()
          foreach ($file in @('mihomo-tun.ps1', 'cleanup-tun.ps1', 'tun-watchdog.ps1', 'packaging/fetch-runtime.ps1')) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            $errorsFound += $errors
          }
          if ($errorsFound.Count) { $errorsFound | Format-List; exit 1 }
